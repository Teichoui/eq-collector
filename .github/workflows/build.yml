name: Build

# Builds and tests on every push and pull request. A version tag (v0.5.0) on main also publishes the single-file exe and puts
# it in a DRAFT release, with its SHA-256, for the maintainer to look over and publish.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Read the version from the project
        id: version
        shell: bash
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/EQCollector.App/EQCollector.App.csproj | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$v</Version> in the project"
            exit 1
          fi

      - name: A release tag must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag $GITHUB_REF_NAME is not on main; only reviewed, merged code is built for release"
            exit 1
          }

      - name: Test
        run: dotnet test -c Release

      - name: Publish the single-file exe
        run: >
          dotnet publish src/EQCollector.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Keep only the exe
        shell: bash
        run: |
          mkdir dist
          cp publish/EQCollector.exe dist/EQCollector.exe

      - name: Upload the exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EQCollector
          path: dist/EQCollector.exe
          if-no-files-found: error

  # A draft release with the exe and its SHA-256, for the maintainer to look over and publish.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: EQCollector
          path: exe

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          name="EQCollector-${VERSION}-win-x64.exe"
          mv exe/EQCollector.exe "$name"
          sha256sum "$name" | awk '{print $1}' > "$name.sha256"
          gh release create "$GITHUB_REF_NAME" "$name" "$name.sha256" --repo "$GITHUB_REPOSITORY" --draft \
            --title "EQ Collector $VERSION" --notes "Built by GitHub Actions from this tag. SHA-256: $(cat "$name.sha256")"
